  <style>
    /* Desktop: Ensure game container is always visible and full-screen */
    @media screen and (min-width: 769px) {
      #rotation-overlay {
        display: none !important;
      }
      #game-container {
        display: block !important;
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
      }
    }
    /* Mobile rotation overlay */
    #rotation-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0e27;
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    
    @media screen and (orientation: portrait) and (max-width: 768px) {
      #rotation-overlay {
        display: flex;
      }
      #game-container {
        display: none;
      }
    }
    
    #rotation-overlay h1 {
      color: #00f0ff;
      font-size: clamp(24px, 6vw, 48px);
      font-family: 'Courier New', monospace;
      margin: 0 0 20px 0;
      text-shadow: 0 0 20px #00f0ff;
    }
    
    #rotation-overlay p {
      color: #ffffff;
      font-size: clamp(16px, 4vw, 24px);
      font-family: 'Courier New', monospace;
      margin: 0 0 30px 0;
      line-height: 1.6;
    }
    
    #rotation-overlay .rotate-icon {
      font-size: clamp(48px, 15vw, 96px);
      color: #00f0ff;
      animation: rotate-pulse 2s ease-in-out infinite;
      margin: 20px 0;
    }
    
    @keyframes rotate-pulse {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(90deg) scale(1.1); }
    }
    
    #rotation-overlay .fullscreen-btn {
      background: linear-gradient(135deg, #00f0ff, #00a8b5);
      border: none;
      color: #000000;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      padding: 15px 40px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }
    
    #rotation-overlay .fullscreen-btn:hover {
      background: linear-gradient(135deg, #00ffff, #00d4e0);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.6);
      transform: translateY(-2px);
    }
    
    #rotation-overlay .fullscreen-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(0, 240, 255, 0.4);
    }
    
    #rotation-overlay .skip-btn {
      background: transparent;
      border: 2px solid #666666;
      color: #999999;
      font-size: clamp(14px, 3vw, 16px);
      font-family: 'Courier New', monospace;
      padding: 10px 30px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
    }
    
    #rotation-overlay .skip-btn:hover {
      border-color: #00f0ff;
      color: #00f0ff;
    }
    
    /* Fullscreen adjustments - hide ALL browser UI */
    body:fullscreen,
    body:-webkit-full-screen,
    body:-moz-full-screen,
    body:-ms-fullscreen {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    #game-container:fullscreen,
    #game-container:-webkit-full-screen,
    #game-container:-moz-full-screen,
    #game-container:-ms-fullscreen,
    body:fullscreen #game-container,
    body:-webkit-full-screen #game-container {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e27;
      z-index: 99999;
    }
    
    /* Prevent scrolling in fullscreen */
    body:fullscreen,
    html:fullscreen {
      overflow: hidden !important;
      position: fixed !important;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* iOS Safari fullscreen fixes */
    @supports (-webkit-overflow-scrolling: touch) {
      body {
        -webkit-overflow-scrolling: none;
      }
      #game-container {
        -webkit-overflow-scrolling: none;
      }
    }
  </style>
  
  <style>

      white-space: pre-wrap;

    }
    #critical-error button {

      border: none;
      color: #000000;
      font-size: clamp(0.875rem, 3vw, 1rem);
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;

  <div id="loading-screen">
    <h1>DATAHEIST</h1>
    <div class="spinner"></div>
    <p>INITIALIZING SYSTEMS...</p>
    <script>
      console.log('[index.html] Loading screen displayed');
      
      const loadingMessages = [
        'INITIALIZING SYSTEMS...',
        'LOADING NEURAL NETWORK...',
        'ESTABLISHING CONNECTIONS...',
        'COMPILING EXPLOITS...',
        'BYPASSING SECURITY...',
        'READY TO HACK...'
      ];
      
      let messageIndex = 0;
      const loadingText = document.querySelector('#loading-screen p');
      
      const messageInterval = setInterval(() => {
        messageIndex = (messageIndex + 1) % loadingMessages.length;
        loadingText.textContent = loadingMessages[messageIndex];
        console.log('[index.html] Loading message:', loadingMessages[messageIndex]);
      }, 1500);
      
      window.addEventListener('load', () => {
        clearInterval(messageInterval);
        console.log('[index.html] Window load event fired');
      });
    </script>

  <script type="module">
    console.log('[index.html] Module script starting execution');
    console.log('[index.html] ES6 modules supported:', true);
    
    const showCriticalError = (title, message, details) => {
      console.error('[index.html] ========================================');
      console.error('[index.html] CRITICAL ERROR HANDLER TRIGGERED');
      console.error('[index.html] ========================================');
      console.error('[index.html] Title:', title);
      console.error('[index.html] Message:', message);
      console.error('[index.html] Details:', details);
      console.error('[index.html] ========================================');
      
      const errorDiv = document.getElementById('critical-error');
      const errorMessage = document.getElementById('error-message');
      const errorDetails = document.getElementById('error-details');
      
      if (errorDiv && errorMessage && errorDetails) {
        const titleElement = errorDiv.querySelector('h1');
        if (titleElement) {
          titleElement.textContent = title;
        }
        errorMessage.textContent = message;
        errorDetails.textContent = details;
        errorDiv.classList.add('visible');
        
        document.getElementById('loading-screen').classList.add('hidden');
        
        console.log('[index.html] Critical error UI displayed');
      } else {
        console.error('[index.html] Error UI elements not found, logging to console only');
        alert(`${title}\n\n${message}\n\n${details}\n\nCheck console (F12) for details`);
      }
    };
    
    const hideLoadingScreen = () => {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
        setTimeout(() => {
          loadingScreen.remove();
          console.log('[index.html] Loading screen removed from DOM');
        }, 500);
        console.log('[index.html] Loading screen hidden');
      } else {
        console.warn('[index.html] Loading screen element not found');
      }
    };
    
    window.addEventListener('unhandledrejection', (event) => {
      console.error('[index.html] ========================================');
      console.error('[index.html] UNHANDLED PROMISE REJECTION');
      console.error('[index.html] ========================================');
      console.error('[index.html] Reason:', event.reason);
      console.error('[index.html] Promise:', event.promise);
      
      if (event.reason && event.reason.stack) {
        console.error('[index.html] Stack trace:', event.reason.stack);
      }
      
      showCriticalError(
        '⚠️ ASYNC ERROR',
        'Unhandled Promise Rejection',
        `${event.reason}\n\n${event.reason && event.reason.stack ? event.reason.stack : 'No stack trace'}`
      );
      
      event.preventDefault();
    });
    
    window.addEventListener('error', (event) => {
      console.error('[index.html] ========================================');
      console.error('[index.html] GLOBAL ERROR HANDLER');
      console.error('[index.html] ========================================');
      console.error('[index.html] Message:', event.message);
      console.error('[index.html] Source:', event.filename);
      console.error('[index.html] Line:', event.lineno);
      console.error('[index.html] Column:', event.colno);
      console.error('[index.html] Error object:', event.error);
      
      if (event.error && event.error.stack) {
        console.error('[index.html] Stack trace:', event.error.stack);
      }
      
      if (event.message && event.message.includes('module')) {
        showCriticalError(
          '⚠️ MODULE ERROR',
          'Failed to load game module',
          `${event.message}\n\nFile: ${event.filename}\nLine: ${event.lineno}:${event.colno}\n\n${event.error && event.error.stack ? event.error.stack : 'No stack trace'}`
        );
      }
    });
    
    const checkCompatibility = () => {
      console.log('[index.html] ========================================');
      console.log('[index.html] BROWSER COMPATIBILITY CHECK');
      console.log('[index.html] ========================================');
      
      const features = {
        es6Modules: typeof Symbol !== 'undefined',
        es6Classes: typeof class {} === 'function',
        es6Promises: typeof Promise !== 'undefined',
        es6ArrowFunctions: (() => true)(),
        webgl: (() => {
          try {
            const canvas = document.createElement('canvas');
            return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
          } catch (e) {
            return false;
          }
        })(),
        webgl2: (() => {
          try {
            const canvas = document.createElement('canvas');
            return !!canvas.getContext('webgl2');
          } catch (e) {
            return false;
          }
        })(),
        canvas2d: (() => {
          try {
            const canvas = document.createElement('canvas');
            return !!canvas.getContext('2d');
          } catch (e) {
            return false;
          }
        })(),
        localStorage: (() => {
          try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            return true;
          } catch (e) {
            return false;
          }
        })(),
        indexedDB: typeof indexedDB !== 'undefined',
        serviceWorker: 'serviceWorker' in navigator,
        audioContext: typeof (window.AudioContext || window.webkitAudioContext) !== 'undefined'
      };
      
      console.log('[index.html] Feature support:', features);
      
      const missingFeatures = Object.entries(features)
        .filter(([key, value]) => !value)
        .map(([key]) => key);
      
      if (missingFeatures.length > 0) {
        console.warn('[index.html] Missing features:', missingFeatures);
        
        if (!features.es6Modules || !features.es6Classes || !features.es6Promises) {
          showCriticalError(
            '⚠️ BROWSER NOT SUPPORTED',
            'Your browser does not support required JavaScript features',
            `Missing: ${missingFeatures.join(', ')}\n\nPlease use a modern browser:\n- Chrome 90+\n- Firefox 88+\n- Safari 14+\n- Edge 90+`
          );
          return false;
        }
        
        if (!features.webgl && !features.canvas2d) {
          showCriticalError(
            '⚠️ GRAPHICS NOT SUPPORTED',
            'Your browser does not support WebGL or Canvas2D',
            'Please enable hardware acceleration or use a different browser'
          );
          return false;
        }
      }
      
      console.log('[index.html] ✅ Browser compatibility check passed');
      return true;
    };
    
    if (!checkCompatibility()) {
      console.error('[index.html] Browser compatibility check failed, stopping execution');
    } else {
      console.log('[index.html] Attempting to load main.js module...');
      
      try {
        import('../src/main.js')
          .then((module) => {
            console.log('[index.html] ✅ main.js module loaded successfully');
            console.log('[index.html] Module exports:', Object.keys(module));
            console.log('[index.html] Game instance:', module.default);
            
            setTimeout(() => {
              hideLoadingScreen();
              console.log('[index.html] Game initialization complete');
            }, 1000);
          })
          .catch((error) => {
            console.error('[index.html] ========================================');
            console.error('[index.html] FATAL: Failed to import main.js');
            console.error('[index.html] ========================================');
            console.error('[index.html] Error name:', error.name);
            console.error('[index.html] Error message:', error.message);
            console.error('[index.html] Stack trace:', error.stack);
            console.error('[index.html] ========================================');
            
            showCriticalError(
              '⚠️ MODULE LOAD FAILED',
              'Failed to load game module (main.js)',
              `${error.name}: ${error.message}\n\n${error.stack}\n\nPossible causes:\n- File not found (check src/main.js exists)\n- Import syntax error\n- Dependency missing\n- CORS policy blocking module`
            );
          });
      } catch (error) {
        console.error('[index.html] ========================================');
        console.error('[index.html] FATAL: Exception during module import');
        console.error('[index.html] ========================================');
        console.error('[index.html] Error:', error);
        console.error('[index.html] ========================================');
        
        showCriticalError(
          '⚠️ IMPORT EXCEPTION',
          'Exception thrown during module import',
          `${error.toString()}\n\n${error.stack || 'No stack trace'}`
        );
      }
    }
  </script>

  <script>
    // Mobile fullscreen and orientation handling
    console.log('[index.html] Mobile fullscreen script loaded');
    
    /**
     * Enter fullscreen mode and hide all browser UI
     */
    window.enterFullscreenAndPlay = async function() {
      console.log('[index.html] enterFullscreenAndPlay: Entering TRUE fullscreen mode...');
      
      const gameContainer = document.getElementById('game-container');
      const rotationOverlay = document.getElementById('rotation-overlay');
      const body = document.body;
      const html = document.documentElement;
      
      if (!gameContainer) {
        console.error('[index.html] Game container not found');
        return;
      }
      
      try {
        // Step 1: Hide address bar by scrolling (mobile trick)
        window.scrollTo(0, 1);
        setTimeout(() => window.scrollTo(0, 0), 0);
        
        // Step 2: Set viewport height to actual viewport (ignore browser chrome)
        const setViewportHeight = () => {
          const vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', `${vh}px`);
          gameContainer.style.height = `${window.innerHeight}px`;
          gameContainer.style.width = `${window.innerWidth}px`;
        };
        setViewportHeight();
        
        // Update on resize/orientation change
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', () => {
          setTimeout(setViewportHeight, 100);
        });
        
        // Step 3: Request fullscreen API (hides ALL browser UI)
        let fullscreenSuccess = false;
        
        // Try document.body first (most compatible)
        if (body.requestFullscreen) {
          await body.requestFullscreen({ navigationUI: "hide" });
          fullscreenSuccess = true;
        } else if (body.webkitRequestFullscreen) {
          await body.webkitRequestFullscreen(); // Safari iOS
          fullscreenSuccess = true;
        } else if (body.mozRequestFullScreen) {
          await body.mozRequestFullScreen(); // Firefox
          fullscreenSuccess = true;
        } else if (body.msRequestFullscreen) {
          await body.msRequestFullscreen(); // IE11
          fullscreenSuccess = true;
        }
        
        // Fallback: try on game-container
        if (!fullscreenSuccess) {
          if (gameContainer.requestFullscreen) {
            await gameContainer.requestFullscreen({ navigationUI: "hide" });
            fullscreenSuccess = true;
          } else if (gameContainer.webkitRequestFullscreen) {
            await gameContainer.webkitRequestFullscreen();
            fullscreenSuccess = true;
          }
        }
        
        if (fullscreenSuccess) {
          console.log('[index.html] ✅ Fullscreen API activated - browser UI hidden');
        } else {
          console.warn('[index.html] ⚠️ Fullscreen API not available, using fallback');
        }
        
        // Step 4: Lock screen orientation to landscape
        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock('landscape-primary');
            console.log('[index.html] ✅ Screen locked to landscape-primary');
          } catch (orientError) {
            // Try alternative landscape lock
            try {
              await screen.orientation.lock('landscape');
              console.log('[index.html] ✅ Screen locked to landscape');
            } catch (orientError2) {
              console.warn('[index.html] ⚠️ Screen orientation lock not supported');
            }
          }
        }
        
        // Step 5: Prevent scrolling and bouncing (iOS fix)
        body.style.overflow = 'hidden';
        body.style.position = 'fixed';
        body.style.width = '100%';
        body.style.height = '100%';
        html.style.overflow = 'hidden';
        
        // Prevent pull-to-refresh
        body.style.overscrollBehavior = 'none';
        
        // Prevent zoom
        const viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
        
        // Step 6: Hide rotation overlay
        if (rotationOverlay) {
          rotationOverlay.style.display = 'none';
        }
        
        // Step 7: Force game container to fill screen
        gameContainer.style.position = 'fixed';
        gameContainer.style.top = '0';
        gameContainer.style.left = '0';
        gameContainer.style.width = '100vw';
        gameContainer.style.height = '100vh';
        gameContainer.style.zIndex = '9999';
        
        console.log('[index.html] ✅ TRUE FULLSCREEN MODE ACTIVE');
        console.log('[index.html] Viewport:', {
          width: window.innerWidth,
          height: window.innerHeight,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight
        });
        
      } catch (error) {
        console.error('[index.html] ❌ Fullscreen request failed:', error);
        console.error('[index.html] Error name:', error.name);
        console.error('[index.html] Error message:', error.message);
        
        // Ultimate fallback: just maximize without fullscreen API
        body.style.overflow = 'hidden';
        body.style.position = 'fixed';
        body.style.width = '100%';
        body.style.height = '100%';
        gameContainer.style.position = 'fixed';
        gameContainer.style.top = '0';
        gameContainer.style.left = '0';
        gameContainer.style.width = '100vw';
        gameContainer.style.height = '100vh';
        
        if (rotationOverlay) {
          rotationOverlay.style.display = 'none';
        }
        
        console.log('[index.html] ⚠️ Using fallback fullscreen mode');
      }
    };
    
    /**
     * Skip rotation warning (not recommended)
     */
    window.skipRotationWarning = function() {
      console.log('[index.html] skipRotationWarning: User chose to skip rotation warning');
      
      const rotationOverlay = document.getElementById('rotation-overlay');
      const gameContainer = document.getElementById('game-container');
      const body = document.body;
      
      if (rotationOverlay) {
        rotationOverlay.style.display = 'none';
      }
      
      if (gameContainer) {
        gameContainer.style.display = 'block';
      }
      
      // Still apply some mobile optimizations
      body.style.overflow = 'hidden';
      window.scrollTo(0, 1);
    };
    
    // Handle fullscreen exit gracefully
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        console.log('[index.html] ⚠️ Exited fullscreen mode');
        
        // Unlock screen orientation
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
        
        // Show exit message
        if (confirm('You exited fullscreen mode. Return to fullscreen?')) {
          enterFullscreenAndPlay();
        }
      }
    });
    
    // Webkit fullscreen change (Safari)
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement) {
        console.log('[index.html] ⚠️ Exited webkit fullscreen mode');
      }
    });
    
    // Prevent accidental exit gestures on mobile
    let lastTouchY = 0;
    document.addEventListener('touchstart', (e) => {
      lastTouchY = e.touches[0].clientY;
    }, { passive: false });
    
    document.addEventListener('touchmove', (e) => {
      const touchY = e.touches[0].clientY;
      const touchYDelta = touchY - lastTouchY;
      
      // Prevent pull-down-to-refresh
      if (touchYDelta > 0 && window.scrollY === 0) {
        e.preventDefault();
      }
      
      lastTouchY = touchY;
    }, { passive: false });
    
    console.log('[index.html] ✅ Enhanced mobile fullscreen functions initialized');
  </script>
