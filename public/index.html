<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <meta name="x5-fullscreen" content="true">
  <meta name="description" content="DataHeist - A cyberpunk-themed roguelike deckbuilder where you hack corporate networks">
  <meta name="keywords" content="dataheist, cyberpunk, roguelike, deckbuilder, hacking game">
  <meta name="author" content="DataHeist Development Team">
  <meta name="theme-color" content="#0a0e27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DataHeist">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  
  <title>DataHeist - Cyberpunk Hacking Roguelike</title>
  
  <link rel="stylesheet" href="styles/game.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Force landscape orientation warning */
    @media screen and (orientation: portrait) {
      body::before {
        content: '⟲ Please rotate your device to landscape mode';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0e27;
        color: #00f0ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-family: 'Courier New', monospace;
        text-align: center;
        z-index: 999999;
        padding: 20px;
      }
      #game-container {
        display: none;
      }
    }
  </style>
  
  <style>
    #critical-error {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0a0e27;
      border: 4px solid #ff0055;
      padding: 40px;
      border-radius: 8px;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      max-width: 90vw;
      max-height: 90vh;
      overflow-y: auto;
      z-index: 99999;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 0, 85, 0.8);
    }
    #critical-error.visible {
      display: block;
    }
    #critical-error h1 {
      color: #ff0055;
      margin: 0 0 20px 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      text-shadow: 0 0 10px #ff0055;
    }
    #critical-error p {
      color: #00f0ff;
      margin: 10px 0;
      font-size: clamp(0.875rem, 3vw, 1rem);
      line-height: 1.6;
    }
    #critical-error .error-code {
      background: rgba(255, 0, 85, 0.2);
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
      font-family: monospace;
      font-size: clamp(0.75rem, 2.5vw, 0.875rem);
      text-align: left;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #critical-error button {
      margin: 10px;
      padding: 12px 24px;
      background: #00f0ff;
      border: none;
      color: #000000;
      font-size: clamp(0.875rem, 3vw, 1rem);
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      font-family: 'Courier New', monospace;
    }
    #critical-error button:hover {
      background: #ffffff;
      box-shadow: 0 0 20px #00f0ff;
    }
  </style>
</head>
<body>
  <script>
    console.log('[index.html] ========================================');
    console.log('[index.html] HTML DOCUMENT LOADING');
    console.log('[index.html] ========================================');
    console.log('[index.html] Timestamp:', new Date().toISOString());
    console.log('[index.html] User Agent:', navigator.userAgent);
    console.log('[index.html] Platform:', navigator.platform);
    console.log('[index.html] Language:', navigator.language);
    console.log('[index.html] Screen:', {
      width: screen.width,
      height: screen.height,
      availWidth: screen.availWidth,
      availHeight: screen.availHeight,
      colorDepth: screen.colorDepth,
      pixelDepth: screen.pixelDepth,
      orientation: screen.orientation ? screen.orientation.type : 'unknown'
    });
    console.log('[index.html] Window:', {
      innerWidth: window.innerWidth,
      innerHeight: window.innerHeight,
      outerWidth: window.outerWidth,
      outerHeight: window.outerHeight,
      devicePixelRatio: window.devicePixelRatio
    });
    console.log('[index.html] Device:', {
      isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
      isTablet: /iPad|Android(?!.*Mobile)/i.test(navigator.userAgent),
      isTouch: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
      maxTouchPoints: navigator.maxTouchPoints || 0
    });
    console.log('[index.html] Browser:', {
      vendor: navigator.vendor,
      cookieEnabled: navigator.cookieEnabled,
      doNotTrack: navigator.doNotTrack,
      onLine: navigator.onLine,
      hardwareConcurrency: navigator.hardwareConcurrency
    });
    console.log('[index.html] Memory:', navigator.deviceMemory ? `${navigator.deviceMemory}GB` : 'unknown');
    console.log('[index.html] Connection:', navigator.connection ? {
      effectiveType: navigator.connection.effectiveType,
      downlink: navigator.connection.downlink,
      rtt: navigator.connection.rtt,
      saveData: navigator.connection.saveData
    } : 'unknown');
  </script>

  <div id="game-container">
    <script>
      console.log('[index.html] Game container element created');
      console.log('[index.html] Container dimensions:', {
        offsetWidth: document.getElementById('game-container').offsetWidth,
        offsetHeight: document.getElementById('game-container').offsetHeight,
        clientWidth: document.getElementById('game-container').clientWidth,
        clientHeight: document.getElementById('game-container').clientHeight
      });
    </script>
  </div>

  <div id="loading-screen">
    <h1>DATAHEIST</h1>
    <div class="spinner"></div>
    <p>INITIALIZING SYSTEMS...</p>
    <script>
      console.log('[index.html] Loading screen displayed');
      
      const loadingMessages = [
        'INITIALIZING SYSTEMS...',
        'LOADING NEURAL NETWORK...',
        'ESTABLISHING CONNECTIONS...',
        'COMPILING EXPLOITS...',
        'BYPASSING SECURITY...',
        'READY TO HACK...'
      ];
      
      let messageIndex = 0;
      const loadingText = document.querySelector('#loading-screen p');
      
      const messageInterval = setInterval(() => {
        messageIndex = (messageIndex + 1) % loadingMessages.length;
        loadingText.textContent = loadingMessages[messageIndex];
        console.log('[index.html] Loading message:', loadingMessages[messageIndex]);
      }, 1500);
      
      window.addEventListener('load', () => {
        clearInterval(messageInterval);
        console.log('[index.html] Window load event fired');
      });
    </script>
  </div>

  <div id="critical-error">
    <h1>⚠️ CRITICAL ERROR</h1>
    <p id="error-message">An unexpected error occurred</p>
    <div id="error-details" class="error-code"></div>
    <button onclick="location.reload()">RELOAD PAGE</button>
    <button onclick="document.getElementById('critical-error').classList.remove('visible')">DISMISS</button>
    <p style="color: #999999; font-size: 0.75rem; margin-top: 20px;">
      If this error persists, please check the browser console (F12) for detailed logs
    </p>
  </div>

  <!-- Load Phaser globally BEFORE any modules -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    console.log('[index.html] Phaser loaded globally:', Phaser.VERSION);
  </script>

  <script type="module">
    console.log('[index.html] Module script starting execution');
    console.log('[index.html] ES6 modules supported:', true);
    
    const showCriticalError = (title, message, details) => {
      console.error('[index.html] ========================================');
      console.error('[index.html] CRITICAL ERROR HANDLER TRIGGERED');
      console.error('[index.html] ========================================');
      console.error('[index.html] Title:', title);
      console.error('[index.html] Message:', message);
      console.error('[index.html] Details:', details);
      console.error('[index.html] ========================================');
      
      const errorDiv = document.getElementById('critical-error');
      const errorMessage = document.getElementById('error-message');
      const errorDetails = document.getElementById('error-details');
      
      if (errorDiv && errorMessage && errorDetails) {
        const titleElement = errorDiv.querySelector('h1');
        if (titleElement) {
          titleElement.textContent = title;
        }
        errorMessage.textContent = message;
        errorDetails.textContent = details;
        errorDiv.classList.add('visible');
        
        document.getElementById('loading-screen').classList.add('hidden');
        
        console.log('[index.html] Critical error UI displayed');
      } else {
        console.error('[index.html] Error UI elements not found, logging to console only');
        alert(`${title}\n\n${message}\n\n${details}\n\nCheck console (F12) for details`);
      }
    };
    
    const hideLoadingScreen = () => {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
        setTimeout(() => {
          loadingScreen.remove();
          console.log('[index.html] Loading screen removed from DOM');
        }, 500);
        console.log('[index.html] Loading screen hidden');
      } else {
        console.warn('[index.html] Loading screen element not found');
      }
    };
    
    window.addEventListener('unhandledrejection', (event) => {
      console.error('[index.html] ========================================');
      console.error('[index.html] UNHANDLED PROMISE REJECTION');
      console.error('[index.html] ========================================');
      console.error('[index.html] Reason:', event.reason);
      console.error('[index.html] Promise:', event.promise);
      
      if (event.reason && event.reason.stack) {
        console.error('[index.html] Stack trace:', event.reason.stack);
      }
      
      showCriticalError(
        '⚠️ ASYNC ERROR',
        'Unhandled Promise Rejection',
        `${event.reason}\n\n${event.reason && event.reason.stack ? event.reason.stack : 'No stack trace'}`
      );
      
      event.preventDefault();
    });
    
    window.addEventListener('error', (event) => {
      console.error('[index.html] ========================================');
      console.error('[index.html] GLOBAL ERROR HANDLER');
      console.error('[index.html] ========================================');
      console.error('[index.html] Message:', event.message);
      console.error('[index.html] Source:', event.filename);
      console.error('[index.html] Line:', event.lineno);
      console.error('[index.html] Column:', event.colno);
      console.error('[index.html] Error object:', event.error);
      
      if (event.error && event.error.stack) {
        console.error('[index.html] Stack trace:', event.error.stack);
      }
      
      if (event.message && event.message.includes('module')) {
        showCriticalError(
          '⚠️ MODULE ERROR',
          'Failed to load game module',
          `${event.message}\n\nFile: ${event.filename}\nLine: ${event.lineno}:${event.colno}\n\n${event.error && event.error.stack ? event.error.stack : 'No stack trace'}`
        );
      }
    });
    
    const checkCompatibility = () => {
      console.log('[index.html] ========================================');
      console.log('[index.html] BROWSER COMPATIBILITY CHECK');
      console.log('[index.html] ========================================');
      
      const features = {
        es6Modules: typeof Symbol !== 'undefined',
        es6Classes: typeof class {} === 'function',
        es6Promises: typeof Promise !== 'undefined',
        es6ArrowFunctions: (() => true)(),
        webgl: (() => {
          try {
            const canvas = document.createElement('canvas');
            return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
          } catch (e) {
            return false;
          }
        })(),
        webgl2: (() => {
          try {
            const canvas = document.createElement('canvas');
            return !!canvas.getContext('webgl2');
          } catch (e) {
            return false;
          }
        })(),
        canvas2d: (() => {
          try {
            const canvas = document.createElement('canvas');
            return !!canvas.getContext('2d');
          } catch (e) {
            return false;
          }
        })(),
        localStorage: (() => {
          try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            return true;
          } catch (e) {
            return false;
          }
        })(),
        indexedDB: typeof indexedDB !== 'undefined',
        serviceWorker: 'serviceWorker' in navigator,
        audioContext: typeof (window.AudioContext || window.webkitAudioContext) !== 'undefined'
      };
      
      console.log('[index.html] Feature support:', features);
      
      const missingFeatures = Object.entries(features)
        .filter(([key, value]) => !value)
        .map(([key]) => key);
      
      if (missingFeatures.length > 0) {
        console.warn('[index.html] Missing features:', missingFeatures);
        
        if (!features.es6Modules || !features.es6Classes || !features.es6Promises) {
          showCriticalError(
            '⚠️ BROWSER NOT SUPPORTED',
            'Your browser does not support required JavaScript features',
            `Missing: ${missingFeatures.join(', ')}\n\nPlease use a modern browser:\n- Chrome 90+\n- Firefox 88+\n- Safari 14+\n- Edge 90+`
          );
          return false;
        }
        
        if (!features.webgl && !features.canvas2d) {
          showCriticalError(
            '⚠️ GRAPHICS NOT SUPPORTED',
            'Your browser does not support WebGL or Canvas2D',
            'Please enable hardware acceleration or use a different browser'
          );
          return false;
        }
      }
      
      console.log('[index.html] ✅ Browser compatibility check passed');
      return true;
    };
    
    if (!checkCompatibility()) {
      console.error('[index.html] Browser compatibility check failed, stopping execution');
    } else {
      console.log('[index.html] Attempting to load main.js module...');
      
      try {
        import('../src/main.js')
          .then((module) => {
            console.log('[index.html] ✅ main.js module loaded successfully');
            console.log('[index.html] Module exports:', Object.keys(module));
            console.log('[index.html] Game instance:', module.default);
            
            setTimeout(() => {
              hideLoadingScreen();
              console.log('[index.html] Game initialization complete');
            }, 1000);
          })
          .catch((error) => {
            console.error('[index.html] ========================================');
            console.error('[index.html] FATAL: Failed to import main.js');
            console.error('[index.html] ========================================');
            console.error('[index.html] Error name:', error.name);
            console.error('[index.html] Error message:', error.message);
            console.error('[index.html] Stack trace:', error.stack);
            console.error('[index.html] ========================================');
            
            showCriticalError(
              '⚠️ MODULE LOAD FAILED',
              'Failed to load game module (main.js)',
              `${error.name}: ${error.message}\n\n${error.stack}\n\nPossible causes:\n- File not found (check src/main.js exists)\n- Import syntax error\n- Dependency missing\n- CORS policy blocking module`
            );
          });
      } catch (error) {
        console.error('[index.html] ========================================');
        console.error('[index.html] FATAL: Exception during module import');
        console.error('[index.html] ========================================');
        console.error('[index.html] Error:', error);
        console.error('[index.html] ========================================');
        
        showCriticalError(
          '⚠️ IMPORT EXCEPTION',
          'Exception thrown during module import',
          `${error.toString()}\n\n${error.stack || 'No stack trace'}`
        );
      }
    }
  </script>

  <script>
    console.log('[index.html] Non-module fallback script loaded');
    
    if (!window.Promise) {
      console.error('[index.html] Promise not supported - this browser is too old');
      alert('BROWSER TOO OLD\n\nDataHeist requires a modern browser.\nPlease update to:\n- Chrome 90+\n- Firefox 88+\n- Safari 14+\n- Edge 90+');
    }
    
    window.addEventListener('DOMContentLoaded', () => {
      console.log('[index.html] DOM Content Loaded');
      console.log('[index.html] Document ready state:', document.readyState);
      console.log('[index.html] Body dimensions:', {
        offsetWidth: document.body.offsetWidth,
        offsetHeight: document.body.offsetHeight,
        scrollWidth: document.body.scrollWidth,
        scrollHeight: document.body.scrollHeight
      });
    });
    
    window.addEventListener('load', () => {
      console.log('[index.html] Window fully loaded');
      console.log('[index.html] All resources loaded (images, stylesheets, scripts)');
      console.log('[index.html] Performance timing:', {
        navigationStart: performance.timing.navigationStart,
        domLoading: performance.timing.domLoading,
        domInteractive: performance.timing.domInteractive,
        domContentLoadedEventEnd: performance.timing.domContentLoadedEventEnd,
        loadEventEnd: performance.timing.loadEventEnd,
        totalTime: performance.timing.loadEventEnd - performance.timing.navigationStart
      });
    });
    
    window.addEventListener('resize', () => {
      console.log('[index.html] Window resized:', {
        innerWidth: window.innerWidth,
        innerHeight: window.innerHeight,
        devicePixelRatio: window.devicePixelRatio,
        orientation: screen.orientation ? screen.orientation.type : 'unknown'
      });
    });
    
    window.addEventListener('orientationchange', () => {
      console.log('[index.html] Orientation changed:', {
        orientation: screen.orientation ? screen.orientation.type : window.orientation,
        angle: screen.orientation ? screen.orientation.angle : 'unknown'
      });
    });
    
    window.addEventListener('online', () => {
      console.log('[index.html] Connection status: ONLINE');
    });
    
    window.addEventListener('offline', () => {
      console.warn('[index.html] Connection status: OFFLINE');
    });
    
    window.addEventListener('beforeunload', (event) => {
      console.log('[index.html] Page unloading (beforeunload event)');
      console.log('[index.html] Navigation type:', performance.navigation.type);
    });
    
    window.addEventListener('visibilitychange', () => {
      console.log('[index.html] Visibility changed:', {
        hidden: document.hidden,
        visibilityState: document.visibilityState
      });
    });
    
    document.addEventListener('fullscreenchange', () => {
      console.log('[index.html] Fullscreen changed:', {
        isFullscreen: !!document.fullscreenElement,
        element: document.fullscreenElement
      });
    });
    
    console.log('[index.html] ========================================');
    console.log('[index.html] HTML DOCUMENT PARSING COMPLETE');
    console.log('[index.html] ========================================');
  </script>

  <noscript>
    <div style="
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0a0e27;
      border: 4px solid #ff0055;
      padding: 40px;
      border-radius: 8px;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      text-align: center;
      max-width: 90vw;
      z-index: 999999;
    ">
      <h1 style="color: #ff0055; margin: 0 0 20px 0;">JAVASCRIPT REQUIRED</h1>
      <p style="color: #00f0ff; margin: 0 0 20px 0;">
        DataHeist requires JavaScript to run.
      </p>
      <p style="color: #ffffff; margin: 0;">
        Please enable JavaScript in your browser settings and reload the page.
      </p>
    </div>
  </noscript>
</body>
</html>
